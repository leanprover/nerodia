name = "nerodia-manual"
defaultTargets = ["NerodiaManual", "docs"]
moreGlobalServerArgs = ["-Dweak.skipExamples=true"]

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.33.0"

[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
rev = "verso-v4.33.0"

[[require]]
name = "nerodia"
path = ".."

[[lean_lib]]
name = "NerodiaManual"
allowNonModules = true

[[lean_exe]]
name = "docs"
root = "Main"
